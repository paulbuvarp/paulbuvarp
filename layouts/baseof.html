<!DOCTYPE html>
<html lang="{{ or site.Language.Params.hreflang site.Language.Lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      {{ partial "wordmark.html" . }}
      <div class="masthead-right">
        <nav class="nav">
          {{ range site.Menus.main }}
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          {{ end }}
        </nav>
        {{ partial "social-icons.html" . }}
        {{ partial "langswitch.html" . }}
      </div>
    </div>
  </header>

  {{ partial "lang-suggest.html" . }}

  <main class="wrap{{ if and (eq .Kind "page") (eq .Section "concepts") }} wrap--rail{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
