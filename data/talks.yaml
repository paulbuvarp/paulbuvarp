# ---------------------------------------------------------------------------
# UPCOMING TALKS. Past entries move to the bottom of the Talks page by
# themselves — nothing here needs deleting, and nothing goes stale on the
# homepage. The only thing that matters is that `date` is correct.
#
#   date:   YYYY-MM-DD. Required. Everything hinges on it.
#   until:  YYYY-MM-DD. Optional, for multi-day events.
#   role:   what you are doing there. Optional.
#   url:    programme or registration page. Optional.
#   organizerURL: the organiser's own site. Optional; feeds schema.org.
#   summary: one sentence on the talk. Optional; feeds schema.org.
#   lang:   "no" or "en". Optional; shown as a small marker.
#
# HOW "AUTOMATIC" ACTUALLY WORKS. Hugo decides what is upcoming by comparing
# each date to the moment the site is BUILT, not the moment somebody visits.
# GitHub Pages builds when you push — so without help, a talk stays under
# Kommende until your next push, however long that is.
#
# .github/workflows/scheduled-build.yml rebuilds the site every morning to
# close that gap. If that file is ever deleted, this page silently goes stale
# again, and nothing will warn you.
#
# A talk with `until` stays upcoming until the day after it ends, so nothing is
# filed under Tidligere while you are still standing there.
# ---------------------------------------------------------------------------

