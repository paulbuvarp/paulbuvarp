- title: "Orality and Literacy"
  author: "Walter J. Ong"
  year: 1982
  tag: "print"
  url: ""
  note_no: "Boken alt dette diskuterer med. Ongs beskrivelse av hva skriftkulturen gjorde med bevisstheten er grunnlinjen enhver tredje tilstand må måles mot."
  note_en: "The book everything here argues with. Ong's account of what literacy did to consciousness is the baseline against which any third condition has to be measured."

- title: "The Printing Press as an Agent of Change"
  author: "Elizabeth Eisenstein"
  year: 1979
  tag: "print"
  url: ""
  note_no: "Argumentet for at fastheten var en bragd, og ikke en egenskap ved verden."
  note_en: "The case that fixity was an achievement rather than a property of the world."

- title: "God, Human, Animal, Machine"
  author: "Meghan O'Gieblyn"
  year: 2021
  tag: "machines"
  url: ""
  note_no: "Den beste fremstillingen jeg kjenner av hva som skjer med metafysikken når maskinene blir gode til å snakke."
  note_en: "The best account I know of what happens to metaphysics when the machines get good at speaking."

- title: "When We Cease to Understand the World"
  author: "Benjamín Labatut"
  year: 2020
  tag: "machines"
  url: ""
  note_no: "Skjønnlitteratur som driver erkjennelsesteori. Om kunnskap som kommer fortere enn evnen til å bære den."
  note_en: "Fiction doing epistemology. On knowledge that arrives faster than the capacity to hold it."
