- title: "Orality and Literacy"
  author: "Walter J. Ong"
  year: 1982
  tag: "print"
  note: "The book everything here argues with. Ong's account of what literacy did to consciousness is the baseline against which any third condition has to be measured."
  url: ""

- title: "The Printing Press as an Agent of Change"
  author: "Elizabeth Eisenstein"
  year: 1979
  tag: "print"
  note: "The case that fixity was an achievement rather than a property of the world."
  url: ""

- title: "God, Human, Animal, Machine"
  author: "Meghan O'Gieblyn"
  year: 2021
  tag: "machines"
  note: "The best account I know of what happens to metaphysics when the machines get good at speaking."
  url: ""

- title: "When We Cease to Understand the World"
  author: "Benjamín Labatut"
  year: 2020
  tag: "machines"
